[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nnschemaparser"
version = "0.3.1"
description = "Parse torch nn.Module models into an inspectable ModelBlockSchema graph and execute it with a faithful schema interpreter"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Cerisara Nathan" }]
requires-python = ">=3.10"
dependencies = ["torch>=2.0"]
keywords = [
    "pytorch",
    "neural-network",
    "graph",
    "schema",
    "interpreter",
    "model-inspection"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/nath54/NNViewer"
Documentation = "https://github.com/nath54/NNViewer/blob/main/docs/DOCUMENTATION.md"
Changelog = "https://github.com/nath54/NNViewer/blob/main/CHANGELOG.md"
Issues = "https://github.com/nath54/NNViewer/issues"

[project.optional-dependencies]
test = ["pytest"]
research = ["transformers>=4.40", "espnet"]

[tool.setuptools.packages.find]
include = ["nnschemaparser*"]

[tool.setuptools.package-data]
nnschemaparser = ["py.typed"]
